<style>
/* Les papiers de la Sucrerie : chaque écran est un objet posé sur un bureau métallique.
   Un seul monde visuel (papier sur bureau), volontairement sans thème sombre. */
:root {
  --bureau: #56604F;
  --kraft: #C6A979;
  --kraft-clair: #D9C39B;
  --kraft-fonce: #A88B5C;
  --isorel: #6B5A43;
  --papier: #ECEAE3;
  --blanc: #FFFFFF;
  --encre: #1F1D1A;
  --carbone: #27368A;
  --carbone-fonce: #1C2868;
  --tampon: #A61E22;
  --graphite: #4A4945;
  --metal: #8E938B;
  --f-imprime: 'Archivo', 'Arial Narrow', Arial, sans-serif;
  --f-pochoir: 'Stardos Stencil', Georgia, serif;
  --f-main: 'Caveat', 'Bradley Hand', 'Segoe Print', cursive;
  color-scheme: light;
}
html, body { height: 100%; }
html { background: var(--bureau); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--bureau); color: var(--encre); font-family: var(--f-imprime); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
/* Écran d'accueil de l'iPhone : la barre d'état est transparente, le contenu passe dessous sans la chevaucher */
body::before { content: ''; position: fixed; z-index: 4; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--bureau); pointer-events: none; }
#app { max-width: 440px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-right, 0px)) calc(92px + env(safe-area-inset-bottom, 0px)) calc(14px + env(safe-area-inset-left, 0px)); box-sizing: border-box; min-height: 100%; }
#app.sans-onglets { padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
button, label.btn, label.lien { touch-action: manipulation; }
main [id] { scroll-margin-top: calc(14px + env(safe-area-inset-top, 0px)); }
.bandeau-maj { display: block; width: 100%; margin-bottom: 14px; padding: 10px 14px; border: 2px solid var(--carbone); border-radius: 2px; background: var(--blanc); text-align: left; font: 500 14px/1.35 var(--f-imprime); cursor: pointer; box-shadow: 0 8px 16px -6px rgba(15, 20, 12, 0.6); }
h1, h2, h3, p, dl, dd, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--carbone); outline-offset: 3px; }
.pile { display: flex; flex-direction: column; gap: 16px; }

/* Matières */
.kraft, .kraft-clair, .kraft-fonce, .papier, .isorel { background-image: url("kraft-grain.png"); background-size: 512px 512px; background-blend-mode: multiply; }
.kraft { background-color: var(--kraft); }
.kraft-clair { background-color: var(--kraft-clair); }
.kraft-fonce { background-color: var(--kraft-fonce); }
.isorel { background-color: var(--isorel); }
.papier { background-color: var(--papier); background-image: url("paper-fibers.png"); }
.objet { position: relative; border-radius: 3px; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35), 0 10px 18px -6px rgba(15, 20, 12, 0.55); }
.carte, .feuille, .bon, .fiche-papier { padding: 16px 18px 18px; }
.feuille { transform: rotate(0.7deg); }
.feuille.inclinee-g { transform: rotate(-0.6deg); }
.note { padding: 12px 14px 14px; background-color: var(--blanc); background-image: url("paper-fibers.png"); background-size: 512px 512px; background-blend-mode: multiply; transform: rotate(-1deg); }

/* Typographie imprimée, manuscrite et pochoir */
.mention { font-weight: 600; font-size: 12px; line-height: 16px; }
.petit { font-weight: 500; font-size: 11px; line-height: 15px; }
.discret { color: var(--graphite); font-size: 14px; line-height: 20px; }
.titre-imprime { font-weight: 800; font-stretch: 72%; font-size: 34px; line-height: 38px; text-wrap: balance; }
.sous-titre { font-weight: 800; font-stretch: 74%; font-size: 24px; line-height: 28px; text-wrap: balance; }
.titre-exo { font-weight: 800; font-stretch: 75%; font-size: 30px; line-height: 34px; text-wrap: balance; }
.manuscrit { font-family: var(--f-main); font-weight: 600; font-size: 25px; line-height: 30px; color: var(--carbone); }
.manuscrit.graphite { color: var(--graphite); font-weight: 500; font-size: 20px; line-height: 24px; }
.pochoir { font-family: var(--f-pochoir); font-weight: 700; font-variant-numeric: tabular-nums; }
.ligne { border-bottom: 1.5px dotted var(--encre); }
.filet { border-top: 2.5px solid var(--encre); margin-top: 6px; }
.entete { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.champs { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 8px; row-gap: 2px; align-items: end; margin-top: 10px; }
.champs dt { font-weight: 600; font-size: 13px; line-height: 30px; }
.champs dd { padding-left: 6px; border-bottom: 1.5px dotted var(--encre); font-family: var(--f-main); font-weight: 600; font-size: 27px; line-height: 30px; color: var(--carbone); min-width: 0; overflow-wrap: anywhere; }
.bloc { display: flex; flex-direction: column; gap: 2px; }
.champs dd.titulaire { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.champs dd.titulaire .lien { flex: none; color: var(--graphite); }
.champs dt.en-haut { align-self: start; padding-top: 7px; }
.champs dd.edition { padding-left: 0; border-bottom: none; }
.champs dd.edition .actions { justify-content: flex-start; }
.aide.alerte { color: var(--tampon); font-weight: 600; }

/* Boutons */
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; padding: 0 16px; box-sizing: border-box; border: none; border-radius: 2px; font: 700 17px/1.2 var(--f-imprime); text-align: center; cursor: pointer; }
.btn-principal { background: var(--carbone); color: var(--blanc); }
.btn-principal:active { background: var(--carbone-fonce); }
.btn-trait { background: transparent; color: var(--encre); border: 2px solid var(--encre); }
.btn-danger { background: var(--tampon); color: var(--blanc); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.lien { display: inline-flex; align-items: center; min-height: 44px; padding: 0; border: none; background: none; font: 700 15px var(--f-imprime); color: var(--encre); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; }

/* Tampons et attaches */
.tampon { position: absolute; mix-blend-mode: multiply; pointer-events: none; }
.tampon.en-ligne { position: static; flex: none; }
.tampon.pose-haut { right: 8px; top: 34px; }
.trombone { position: absolute; left: 26px; top: -30px; }
.pince { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); }

/* Carte d'alimentation */
.xp { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
.cases { display: grid; grid-template-columns: repeat(10, 14px); gap: 2px; }
.case { width: 14px; height: 14px; box-sizing: border-box; border: 1.5px solid var(--encre); }
.case.pleine { background: repeating-linear-gradient(135deg, var(--graphite) 0 1.5px, transparent 1.5px 4px); }
.vivres { position: relative; display: flex; align-items: flex-end; gap: 12px; margin-top: 14px; min-height: 64px; }
.vivres .chiffre { font-size: 72px; line-height: 62px; }
.vivres .tampon { right: -8px; top: -14px; }
.tickets { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin-top: 10px; border-top: 2px dotted var(--encre); }
.ticket { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 56px; border-left: 2px dotted var(--encre); }
.ticket:first-child { border-left: none; }
.ticket .pochoir { font-size: 16px; }
.ticket .mini { font-weight: 700; font-stretch: 75%; font-size: 11px; }
.ticket.decoupe { background: var(--bureau); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.45); border-left-color: transparent; clip-path: polygon(4% 3%, 97% 6%, 99% 96%, 2% 99%); }
.ticket.decoupe:nth-child(2n) { clip-path: polygon(2% 6%, 98% 2%, 97% 98%, 3% 96%); }
.ticket.decoupe:nth-child(3n) { clip-path: polygon(3% 2%, 99% 4%, 98% 99%, 1% 97%); }

/* Ordre de sortie */
.liste-exos { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.liste-exos li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; line-height: 19px; }
.liste-exos li > span:first-child { min-width: 0; }
.liste-exos li > span:last-child { flex: none; color: var(--graphite); text-align: right; }
.liste-exos .petit { color: var(--graphite); }
.liste-exos .prio { color: var(--carbone); font-weight: 700; }
.figure-mesures { display: block; width: 100%; max-width: 240px; height: auto; margin: 12px auto 0; }
.pastille { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; margin-right: 6px; border-radius: 50%; background: var(--tampon); color: var(--blanc); font: 700 15px var(--f-imprime); vertical-align: 3px; }
.etapes { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.etapes li { position: relative; padding-left: 16px; font-size: 15px; line-height: 21px; }
.etapes li::before { content: '–'; position: absolute; left: 0; }
.consigne { margin-top: 6px; font-size: 15px; line-height: 21px; }
.poids { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; }
.poids .pochoir { font-size: 40px; line-height: 44px; }
.pesee-ligne { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: end; margin-top: 8px; }
.pesee-ligne label { grid-column: 1 / -1; }
.pesee-ligne .btn { width: auto; min-width: 112px; }
.aide { margin-top: 2px; color: var(--graphite); font-size: 12px; line-height: 16px; }
.courbe { display: block; width: 100%; height: auto; margin-top: 10px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); }
.defile { overflow-x: auto; }
.tableau-mesures { width: 100%; border-collapse: collapse; margin-top: 12px; font-variant-numeric: tabular-nums; }
.tableau-mesures caption { text-align: left; padding-bottom: 4px; }
.tableau-mesures th, .tableau-mesures td { padding: 4px 6px; border-bottom: 1px solid rgba(31, 29, 26, 0.3); text-align: right; font-size: 13px; }
.tableau-mesures th:first-child { text-align: left; padding-left: 0; }
.tableau-mesures thead th { font-weight: 600; font-size: 12px; }
.tableau-mesures td { font-family: var(--f-main); font-weight: 600; font-size: 21px; color: var(--carbone); }
.groupes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.groupes button { min-height: 44px; border: 2px solid var(--encre); border-radius: 2px; background: transparent; font: 700 14px var(--f-imprime); cursor: pointer; }
.groupes button[aria-pressed="true"] { background: var(--carbone); border-color: var(--carbone); color: var(--blanc); }

/* Presse-papier d'expédition */
.presse { padding: 48px 12px 12px; border-radius: 12px; }
.fiche-papier { border-radius: 2px; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); }
.tableau { margin-top: 10px; }
.tableau .rang { display: grid; grid-template-columns: 56px minmax(0, 1fr) 64px; align-items: center; min-height: 38px; border-bottom: 1px solid rgba(31, 29, 26, 0.35); }
.tableau .rang.tete { min-height: 22px; border-bottom: 2px solid var(--encre); font-weight: 600; font-size: 12px; }
.tableau .rang > :last-child { display: flex; justify-content: center; }
.repos { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding: 8px 12px; border: 2px dashed var(--graphite); }
.compteur { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 4px; }
.rond { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--encre); background: transparent; font: 700 30px/1 var(--f-imprime); cursor: pointer; }
.rond:active { background: rgba(31, 29, 26, 0.08); }
.compteur .chiffre { min-width: 112px; text-align: center; font-size: 96px; line-height: 88px; }
.efforts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.efforts button { min-height: 48px; border: 2px solid var(--encre); border-radius: 2px; background: transparent; font: 700 20px var(--f-pochoir); cursor: pointer; }
.efforts button[aria-pressed="true"] { background: var(--carbone); border-color: var(--carbone); color: var(--blanc); }
.pas { display: flex; align-items: center; gap: 12px; }
.charge-seance { display: flex; justify-content: space-between; gap: 12px; }
.pas input { width: 88px; text-align: center; }

/* Bon de pesée */
.pesee { display: grid; grid-template-columns: minmax(0, 1fr) auto; margin-top: 12px; border-top: 1.5px solid var(--encre); }
.pesee dt, .pesee dd { padding: 4px 0; border-bottom: 1px solid rgba(31, 29, 26, 0.4); }
.pesee dt { font-weight: 600; font-size: 13px; line-height: 22px; }
.pesee dd { font-family: var(--f-main); font-weight: 700; font-size: 24px; line-height: 22px; color: var(--carbone); text-align: right; }
.pesee .net { border-top: 2.5px solid var(--encre); border-bottom: none; }
.pesee dt.net { display: flex; align-items: center; font-weight: 800; font-size: 16px; }
.pesee dd.net { font-family: var(--f-pochoir); color: var(--encre); font-size: 40px; line-height: 42px; }
.butin { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }

/* Formulaires */
label.mention { display: block; }
.saisie, select.saisie { width: 100%; box-sizing: border-box; min-height: 44px; padding: 4px 6px; border: none; border-bottom: 1.5px dotted var(--encre); border-radius: 0; background: transparent; font: 600 25px/1.2 var(--f-main); color: var(--carbone); }
select.saisie { font-size: 22px; }
.mt-4 { margin-top: 4px; } .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
.centre { text-align: center; }
.registre { display: flex; flex-direction: column; margin-top: 8px; }
.rang-carnet { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; width: 100%; min-height: 44px; padding: 6px 0; border: none; border-bottom: 1px solid rgba(31, 29, 26, 0.35); background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.rang-carnet .manuscrit { font-size: 22px; line-height: 26px; min-width: 0; overflow-wrap: anywhere; }
.relique { padding: 8px 0; border-bottom: 1px dashed rgba(31, 29, 26, 0.45); }
.jours { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 4px; }
.jours button { min-height: 44px; border: 2px solid var(--encre); border-radius: 2px; background: transparent; font: 700 13px var(--f-imprime); cursor: pointer; }
.jours button[aria-pressed="true"] { background: var(--encre); color: var(--papier); }
.choix { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="encre" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="bruit"></feTurbulence>

    <pattern id="hachure-sain" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#27368A" stroke-width="1.6" opacity="0.55"></line></pattern>
    <pattern id="hachure-risque" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#A61E22" stroke-width="1.4" opacity="0.4"></line></pattern>
  </defs>
</svg>

<div id="app"></div>
<div id="onglets"></div>
<div id="avis" role="status" aria-live="polite"></div>

<script>
/* Valgrise : moteur de règles du prototype.
   Fonctions pures. L'état du jeu est rejoué à partir du profil et des séances,
   jour par jour, ce qui applique correctement les pauses déclarées après coup. */
(function (root) {
  'use strict';

  // ---------- Dates (chaînes AAAA-MM-JJ, calcul en UTC pour éviter les changements d'heure)
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function localToday(now) {
    const d = now || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function toUTC(s) { const p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function fromUTC(ms) { const d = new Date(ms); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function addDays(s, n) { return fromUTC(toUTC(s) + n * 86400000); }
  function daysBetween(a, b) { return Math.round((toUTC(b) - toUTC(a)) / 86400000); }
  function isoWeekday(s) { const w = new Date(toUTC(s)).getUTCDay(); return w === 0 ? 7 : w; }
  function weekKey(s) {
    const d = new Date(toUTC(s));
    const wd = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - wd);
    const y = d.getUTCFullYear();
    const w = Math.ceil(((d - Date.UTC(y, 0, 1)) / 86400000 + 1) / 7);
    return y + '-S' + pad(w);
  }

  // ---------- Constantes de jeu (document de conception)
  const STOCK_MAX = 7;
  const CHUTE_A = 6;           // 3 jours de faim + 2 d'agonie, chute au 6e matin sans ration
  const MINUTES_MAX_JOUR = 90;
  const BONUS_PREVUE = 1.2;
  const BONUS_SEMAINE = 250;
  const CONVALESCENCE = 2;
  const ABSENCE_MAX = 21;
  const RETRO_MAX = 7;

  function xpPourNiveau(n) { return 200 + 80 * n; }            // XP pour passer de n à n + 1
  function xpCumulee(L) { return (L - 1) * (200 + 40 * L); }   // XP totale pour atteindre L
  function niveau(xp) {
    let L = 1;
    while (xp >= xpCumulee(L + 1)) L++;
    return { niveau: L, dans: xp - xpCumulee(L), besoin: xpPourNiveau(L) };
  }

  // ---------- Élastiques : ceux que possède le joueur, combinés jusqu'à trois à la fois
  const ELASTIQUES_DEPART = [5, 10, 15, 20];   // le kit SmartWorkout de départ
  const COMBINAISON_MAX = 3;
  const ELASTIQUE_MIN = 0.5, ELASTIQUE_MAX = 100, ELASTIQUES_NB_MAX = 10;
  function arrondi(x) { return Math.round(x * 10) / 10; }
  function kgTexte(n) { return String(n).replace('.', ','); }
  function elastiquesDe(p) {
    const l = p && Array.isArray(p.elastiques) ? p.elastiques.filter(function (k) { return typeof k === 'number' && k > 0; }) : [];
    return l.length ? l : ELASTIQUES_DEPART;
  }
  // Moins d'élastiques d'abord, puis la combinaison la plus équilibrée (25 kg = 10 + 15 plutôt que 5 + 20)
  function preferee(a, b) {
    if (a.length !== b.length) return a.length < b.length;
    return a[a.length - 1] < b[b.length - 1];
  }
  // Toutes les résistances possibles, chacune avec sa meilleure combinaison (élastiques triés du plus léger au plus lourd)
  function combinaisons(p) {
    const b = elastiquesDe(p).slice().sort(function (x, y) { return x - y; });
    const meilleures = {};
    function retenir(combo) {
      const t = arrondi(combo.reduce(function (s, k) { return s + k; }, 0));
      if (!meilleures[t] || preferee(combo, meilleures[t])) meilleures[t] = combo;
    }
    for (let i = 0; i < b.length; i++) {
      retenir([b[i]]);
      for (let j = i + 1; j < b.length && COMBINAISON_MAX >= 2; j++) {
        retenir([b[i], b[j]]);
        for (let k = j + 1; k < b.length && COMBINAISON_MAX >= 3; k++) retenir([b[i], b[j], b[k]]);
      }
    }
    return Object.keys(meilleures).map(Number).sort(function (x, y) { return x - y; })
      .map(function (t) { return { kg: t, elastiques: meilleures[t] }; });
  }
  function resistances(p) { return combinaisons(p).map(function (c) { return c.kg; }); }
  function libelleElastique(kg, p) {
    const c = combinaisons(p).filter(function (x) { return x.kg === kg; })[0];
    return kgTexte(kg) + ' kg' + (c && c.elastiques.length > 1 ? ' (' + c.elastiques.map(kgTexte).join(' + ') + ')' : '');
  }

  // ---------- Catalogue d'exercices (échelons construits sur le matériel)
  // Groupes musculaires que le joueur peut mettre en priorité (deux au plus)
  const GROUPES = [
    { id: 'bras', nom: 'Bras' }, { id: 'abdos', nom: 'Abdos' }, { id: 'pectoraux', nom: 'Pectoraux' },
    { id: 'epaules', nom: 'Épaules' }, { id: 'dos', nom: 'Dos' }, { id: 'jambes', nom: 'Jambes, fessiers' }
  ];
  // Exercices que le coach ajoute quand un groupe devient prioritaire
  const COMPLEMENTS = { bras: ['chinup', 'triceps'], abdos: ['releves'], dos: ['chinup'], jambes: ['squat', 'hipthrust'], epaules: ['elevations'] };
  const ORDRE = ['chinup', 'curl', 'triceps', 'squat', 'hipthrust', 'pompes', 'developpe', 'elevations', 'rowing', 'abdos', 'releves'];
  const CATALOGUE = {
    pompes: { nom: 'Pompes', stat: 'Poussée', groupes: ['pectoraux'], type: 'variante', min: 8, max: 12,
      variantes: ['Pompes inclinées', 'Pompes', 'Pompes pieds surélevés', 'Pompes diamant', 'Pompes archer', 'Pompes lestées'] },
    developpe: { nom: 'Développé vertical à l’élastique', stat: 'Poussée', groupes: ['epaules'], type: 'elastique', min: 8, max: 12 },
    curl: { nom: 'Curl biceps aux haltères', stat: 'Tirage', groupes: ['bras'], type: 'charge', min: 8, max: 12, pas: 2, depart: 8 },
    triceps: { nom: 'Extension triceps à l’élastique', stat: 'Poussée', groupes: ['bras'], type: 'elastique', min: 10, max: 15, depart: 10,
      recommande: 'Élastique sous le pied, bras tendus au-dessus de la tête : le triceps fait la plus grosse part du bras.' },
    chinup: { nom: 'Tractions en supination', stat: 'Tirage', groupes: ['bras', 'dos'], type: 'variante', min: 5, max: 8,
      variantes: ['Tractions assistées, pieds sur une chaise', 'Tractions négatives, 5 s de descente', 'Tractions assistées, élastique 20 kg',
        'Tractions assistées, élastique 15 kg', 'Tractions assistées, élastique 10 kg', 'Tractions assistées, élastique 5 kg',
        'Tractions strictes', 'Tractions lestées'],
      recommande: 'Paumes vers toi : biceps et dos dans le même exercice.' },
    // fourchettes : répétitions propres à un échelon (les crunchs se comptent par 12 à 20, la roulette par 6 à 10)
    abdos: { nom: 'Abdos à la roulette', stat: 'Gainage', groupes: ['abdos'], type: 'variante', min: 6, max: 10,
      variantes: ['Crunchs', 'Roulette à genoux, partielle', 'Roulette à genoux', 'Roulette debout vers un mur', 'Roulette debout'],
      fourchettes: [[12, 20]] },
    releves: { nom: 'Relevés à la barre', stat: 'Gainage', groupes: ['abdos'], type: 'variante', min: 6, max: 12,
      variantes: ['Relevés de genoux', 'Relevés de genoux jusqu’à la poitrine', 'Relevés de jambes fléchies', 'Relevés de jambes tendues', 'Pieds à la barre'],
      recommande: 'Suspendu à la barre : le bas des abdos, en complément de la roulette.' },
    rowing: { nom: 'Rowing à l’élastique', stat: 'Tirage', groupes: ['dos'], type: 'elastique', min: 10, max: 15 },
    elevations: { nom: 'Élévations latérales à l’élastique', stat: 'Poussée', groupes: ['epaules'], type: 'elastique', min: 10, max: 15, depart: 5,
      recommande: 'Élastique sous les pieds, bras tendus sur les côtés jusqu’à l’horizontale : la largeur des épaules.' },
    // Mixte : des échelons au poids du corps, puis debout sur les élastiques, poignées aux épaules.
    // Les échelons d'élastique suivent les combinaisons que permettent les élastiques du joueur, à partir de 10 kg.
    squat: { nom: 'Squat', stat: 'Jambes', groupes: ['jambes'], type: 'mixte', min: 12, max: 20,
      variantes: ['Squat sur le banc', 'Squat au poids du corps', 'Squat lent, 3 s à la descente'],
      elastique: 'Squat à l’élastique de ', elastiqueMin: 10,
      recommande: 'Cuisses et fessiers : sur le banc, au poids du corps, puis debout sur les élastiques.' },
    hipthrust: { nom: 'Hip thrust à l’haltère', stat: 'Jambes', groupes: ['jambes'], type: 'charge', min: 10, max: 15, pas: 2, unHaltere: true, depart: 10,
      recommande: 'Dos appuyé contre le canapé, haltère sur les hanches : il complète le squat pour les fessiers.' }
  };
  // Fourchette de répétitions : celle que le joueur a choisie, sinon celle du coach pour le réglage en cours
  const FOURCHETTES = [[3, 5], [4, 6], [5, 8], [6, 10], [8, 12], [10, 15], [12, 20], [15, 25]];
  function fourchetteValide(r) {
    return Array.isArray(r) && r.length === 2 && r.every(function (n) { return Number.isInteger(n); }) && r[0] >= 1 && r[1] > r[0] && r[1] <= 100;
  }
  function fourchetteCoach(ex) {
    const c = CATALOGUE[ex.id];
    const f = c.type === 'variante' && c.fourchettes && c.fourchettes[ex.niveau];
    return f ? { min: f[0], max: f[1] } : { min: c.min, max: c.max };
  }
  function fourchette(ex) {
    return fourchetteValide(ex.reps) ? { min: ex.reps[0], max: ex.reps[1], perso: true } : fourchetteCoach(ex);
  }
  // Fourchettes proposées au joueur : les habituelles, plus celle du coach si elle n'en fait pas partie
  function fourchettesProposees(ex) {
    const coach = fourchetteCoach(ex), l = FOURCHETTES.slice();
    if (!l.some(function (f) { return f[0] === coach.min && f[1] === coach.max; })) l.push([coach.min, coach.max]);
    return l.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
  }
  // Échelons d'élastique d'un exercice mixte : les résistances possibles à partir de son seuil
  function etapesElastique(c, p) {
    return resistances(p).filter(function (kg) { return kg >= (c.elastiqueMin || 0); });
  }
  function nomGroupe(id) {
    for (let i = 0; i < GROUPES.length; i++) if (GROUPES[i].id === id) return GROUPES[i].nom;
    return id;
  }
  function defautExercice(id) {
    const c = CATALOGUE[id];
    const e = { id: id, actif: false, series: 3 };
    if (c.type === 'variante' || c.type === 'mixte') e.niveau = 0;
    else e.charge = c.depart || (c.type === 'elastique' ? 15 : 8);
    return e;
  }

  // ---------- Visite au dispensaire : mensurations toutes les deux semaines, sans XP
  const VISITE_JOURS = 14;
  const MESURES = [
    { cle: 'bras', nom: 'Tour de bras', court: 'Bras', min: 15, max: 70, aide: 'Bras contracté, au plus large.' },
    { cle: 'taille', nom: 'Tour de taille', court: 'Taille', min: 40, max: 200, aide: 'Au niveau du nombril, ventre relâché.' },
    { cle: 'hanches', nom: 'Tour de hanches', court: 'Hanches', min: 50, max: 200, aide: 'Au plus large des fessiers, pieds joints.' }
  ];
  function mesuresTriees(p) {
    return (p.mesures || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  function prochaineVisite(p, aujourdhui) {
    const m = mesuresTriees(p);
    return m.length ? addDays(m[m.length - 1].date, VISITE_JOURS) : aujourdhui;
  }
  function visiteDue(p, aujourdhui) { return prochaineVisite(p, aujourdhui) <= aujourdhui; }

  // ---------- Pesée : le registre retient la moyenne sur 7 jours, jamais d'XP
  const POIDS_MIN = 30, POIDS_MAX = 300;
  function peseesTriees(p) {
    return (p.pesees || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  function moyennePoids(p, date) {
    const debut = addDays(date, -6);
    const l = (p.pesees || []).filter(function (x) { return x.date >= debut && x.date <= date; });
    if (!l.length) return null;
    return { kg: Math.round(l.reduce(function (t, x) { return t + x.kg; }, 0) / l.length * 10) / 10, n: l.length };
  }
  // Écart entre la moyenne de cette semaine et celle de la précédente ; au moins deux pesées de chaque côté
  function tendancePoids(p, date) {
    const now = moyennePoids(p, date), avant = moyennePoids(p, addDays(date, -7));
    if (!now || !avant || now.n < 2 || avant.n < 2) return null;
    const ecart = Math.round((now.kg - avant.kg) * 10) / 10;
    return { ecart: ecart, pct: ecart / avant.kg, rapide: ecart / avant.kg < -0.01 };
  }
  function seriePoids(p, date, jours) {
    const debut = addDays(date, -(jours - 1));
    return peseesTriees(p).filter(function (x) { return x.date >= debut && x.date <= date; })
      .map(function (x) { return { date: x.date, kg: x.kg, moyenne: moyennePoids(p, x.date).kg }; });
  }
  // Rappel sur la carte : seulement le matin, et seulement si la pesée du jour manque
  function rappelPesee(p, date, heure) {
    const r = p.rappelPesee || 'matin';
    if (r === 'jamais' || heure >= 12) return false;
    if (r === 'lundi' && isoWeekday(date) !== 1) return false;
    if (p.peseeReportee === date) return false;
    return !(p.pesees || []).some(function (x) { return x.date === date; });
  }
  // ---------- Bilan d'Ida : repères de santé pour adultes, et suivi sans norme des bras et des hanches.
  // Tour de taille ÷ taille : NICE 2022. IMC : OMS. Masse grasse selon l'âge et le sexe : Gallagher et al. 2000.
  // Indice de masse maigre : médiane des 18-34 ans, Schutz et al. 2002. Jamais d'XP.
  const HAUTEUR_MIN = 120, HAUTEUR_MAX = 230, GRAISSE_MIN = 2, GRAISSE_MAX = 60;
  // [âge de, âge à, sain à partir de, élevé à partir de, très élevé à partir de]
  const GRAISSE_REPERES = {
    homme: [[20, 39, 8, 20, 25], [40, 59, 11, 22, 28], [60, 79, 13, 25, 30]],
    femme: [[20, 39, 21, 33, 39], [40, 59, 23, 34, 40], [60, 79, 24, 36, 42]]
  };
  const MASSE_MAIGRE_MEDIANE = { homme: 18.9, femme: 15.4 };
  // Cibles d'apparence sur l'indice de masse maigre, nommées comme une silhouette (pas des normes de santé). Repère pour les hommes : des pratiquants

            st.faim++;
            if (st.faim >= CHUTE_A) {
              if (ironmanA(profil, d)) { st.nouvellesMorts.push(d); appliquerMort(st); }
              else { st.cicatrices++; st.convalescence = CONVALESCENCE; st.stock = 3; st.faim = 0; st.chutes.push(d); }
            }
          }
        }
      }
      // Séances du jour
      let minutesJour = 0, rangJour = 0;
      while (idx < seances.length && seances[idx].date === d) {
        const s = seances[idx++];
        const compte = Math.max(0, Math.min(s.minutes, MINUTES_MAX_JOUR - minutesJour));
        minutesJour += s.minutes;
        const charge = compte * s.effort;
        let mult = s.prevue ? BONUS_PREVUE : 1;
        const deuxieme = rangJour > 0;
        if (deuxieme) mult *= 0.5;
        const enConvalescence = st.convalescence > 0;
        if (enConvalescence) { mult *= 0.5; st.convalescence--; }
        let xp = Math.round(charge * mult);
        const avant = niveau(st.xp).niveau;
        const affame = st.faim > 0;
        let rations = deuxieme ? 0 : s.rationsBase;
        if (!deuxieme && affame) rations = Math.max(rations, 3);
        const stockAvant = st.stock;
        st.stock = Math.min(STOCK_MAX, st.stock + rations);
        if (!deuxieme) st.faim = 0;
        let bonus = 0;
        const wk = weekKey(d);
        if (s.prevue) {
          st.prevuesSemaine[wk] = (st.prevuesSemaine[wk] || 0) + 1;
          if (st.prevuesSemaine[wk] >= s.cibleSemaine && !st.bonusSemaine[wk]) { st.bonusSemaine[wk] = true; bonus = BONUS_SEMAINE; }
        }
        // Fouille, déterministe pour chaque séance
        const tirages = s.genre === 'expedition' ? (s.prevue ? 2 : 1) : 1;
        const butin = [];
        for (let t = 0; t < tirages; t++) butin.push(fouiller(st, s.id + ':' + t, charge));
        butin.forEach(function (b) { if (b.id === 'conserve') st.stock = Math.min(STOCK_MAX, st.stock + 1); });
        st.xp += xp + bonus;
        if (s.genre === 'expedition') st.expeditions++;
        st.resultats[s.id] = {
          minutesComptees: compte, charge: charge, prevue: s.prevue, deuxieme: deuxieme, convalescence: enConvalescence,
          xp: xp, bonusSemaine: bonus, niveauAvant: avant, niveauApres: niveau(st.xp).niveau,
          rations: st.stock - stockAvant, rationsDues: rations, stockApres: st.stock, butin: butin
        };
        rangJour++;
      }
    }
    const pause = pauseA(profil, fin, aujourdhui);
    const n = niveau(st.xp);
    let statut = 'nourri';
    if (pause) statut = pause.genre === 'absence' ? 'convoi' : 'abri';
    else if (st.faim >= 4) statut = 'agonie';
    else if (st.faim >= 1) statut = 'faim';
    return {
      aujourdhui: fin, stock: st.stock, faim: st.faim, statut: statut, pause: pause,
      joursAvantChute: pause ? null : st.stock + (CHUTE_A - st.faim),
      xp: st.xp, niveau: n.niveau, xpDansNiveau: n.dans, xpBesoin: n.besoin,
      convalescence: st.convalescence, cicatrices: st.cicatrices, chutes: st.chutes,
      nouvellesMorts: st.nouvellesMorts, inventaire: st.inventaire, resultats: st.resultats,
      expeditions: st.expeditions
    };

    function appliquerMort(s) {
      s.xp = 0; s.inventaire = []; s.possede = {}; s.convalescence = 0; s.cicatrices = 0;
      s.stock = STOCK_MAX; s.faim = 0;
    }
  }

  function fouiller(st, graine, charge) {
    const r = rng(hash(graine));
    const pRare = Math.min(0.35, 0.08 + charge / 3000);
    const rare = st.sansRare >= 9 || r() < pRare;
    let pool;
    if (rare) {
      pool = RELIQUES.filter(function (o) { return !st.possede[o.id]; });
      if (pool.length) {
        st.sansRare = 0;
        const o = pool[Math.floor(r() * pool.length)];
        st.possede[o.id] = true;
        const item = { id: o.id, nom: o.nom, genre: 'relique', rarete: 'rare', histoire: o.histoire };
        st.inventaire.push(item);
        return item;
      }
    }
    st.sansRare++;
    if (r() < 0.25) return { id: CONSERVE.id, nom: CONSERVE.nom, genre: 'conserve', rarete: 'commun' };
    pool = TENUES.filter(function (o) { return !st.possede[o.id]; });
    if (!pool.length) return { id: CONSERVE.id, nom: CONSERVE.nom, genre: 'conserve', rarete: 'commun' };
    const o = pool[Math.floor(r() * pool.length)];
    st.possede[o.id] = true;
    const item = { id: o.id, nom: o.nom, genre: 'tenue', rarete: o.rarete };
    st.inventaire.push(item);
    return item;
  }

  // ---------- Coach : double progression
  function suggestions(profil, seances) {
    const res = [];
    const triees = seances.filter(function (s) { return s.genre === 'expedition'; })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.debut < b.debut ? 1 : -1); });
    const enAttente = calibragesEnAttente(profil).map(function (x) { return x.id; });
    profil.programme.forEach(function (ex) {
      if (!ex.actif || enAttente.indexOf(ex.id) >= 0) return;   // le calibrage passe d'abord
      const c = fourchette(ex);
      const cle = reglage(ex, profil);
      const dernieres = [];
      for (let i = 0; i < triees.length && dernieres.length < 2; i++) {
        // Charge changée en cours de séance : c'est le dernier réglage de l'exercice qui compte
        const e = (triees[i].exercices || []).filter(function (x) { return x.id === ex.id; }).pop();
        if (!e || !e.series.length) continue;
        if (e.reglage !== cle) break;
        dernieres.push(e);
      }
      if (dernieres.length < 2) return;
      const plafond = dernieres.every(function (e) { return e.series.length >= (e.prevu || ex.series) && e.series.every(function (v) { return v >= c.max; }); });
      const sous = dernieres.every(function (e) { return e.series.some(function (v) { return v < c.min; }); });
      const sens = plafond ? 1 : sous ? -1 : 0;
      if (!sens) return;
      const vers = changerReglage(ex, sens, profil);
      if (!vers) {
        // Rien de plus facile : le coach propose une fourchette plus basse, tirée de la dernière séance
        if (sens > 0) return;
        const f = proposerFourchette(dernieres[0].series, fourchettesProposees(ex));
        if (!f || f[0] >= c.min) return;
        const nouveau = Object.assign({}, ex, { reps: f }), coach = fourchetteCoach(ex);
        if (f[0] === coach.min && f[1] === coach.max) delete nouveau.reps;
        res.push({ id: ex.id, sens: -1, depuis: cle, vers: f[0] + ' à ' + f[1] + ' répétitions', nouveau: nouveau,
          texte: 'Sous la fourchette deux fois de suite, sans échelon plus facile : ' + f[0] + ' à ' + f[1] + ' répétitions.' });
        return;
      }
      const libelle = reglage(vers, profil);
      res.push({ id: ex.id, sens: sens, depuis: cle, vers: libelle, nouveau: vers,
        texte: (sens > 0 ? 'Plafond atteint deux fois de suite : ' : 'Sous la fourchette deux fois de suite : ') + libelle.toLowerCase() + '.' });
    });
    return res;
  }
  function changerReglage(ex, sens, p) {
    const c = CATALOGUE[ex.id];
    const n = Object.assign({}, ex);
    if (c.type === 'variante') {
      n.niveau = ex.niveau + sens;
      if (n.niveau < 0 || n.niveau >= c.variantes.length) return null;
    } else if (c.type === 'mixte') {
      // Du dernier échelon au poids du corps vers le premier élastique, et retour
      const V = c.variantes.length, etapes = etapesElastique(c, p);
      if (ex.niveau < V) {
        n.niveau = ex.niveau + sens;
        if (n.niveau < 0) return null;
        if (n.niveau === V) { if (!etapes.length) return null; n.charge = etapes[0]; }
      } else {
        const i = etapes.indexOf(ex.charge) + sens;
        if (i < 0) { n.niveau = V - 1; delete n.charge; }
        else if (i >= etapes.length) return null;
        else n.charge = etapes[i];
      }
    } else if (c.type === 'elastique') {
      const r = resistances(p), i = r.indexOf(ex.charge) + sens;
      if (i < 0 || i >= r.length) return null;
      n.charge = r[i];
    } else {
      n.charge = Math.max(1, ex.charge + sens * c.pas);
      if (n.charge === ex.charge) return null;
    }
    return n;
  }

  // ---------- Exercices à charge : élastiques, haltères, et squat une fois debout sur les élastiques.
  // Quand la charge ne convient pas, c'est elle qui bouge : la fourchette du coach reste.
  function aCharge(ex) {
    const c = CATALOGUE[ex.id];
    return !!c && (c.type === 'elastique' || c.type === 'charge' || (c.type === 'mixte' && ex.niveau >= c.variantes.length));
  }
  // Les charges possibles pour cet exercice, de la plus légère à la plus lourde
  function chargesPossibles(ex, p) {
    const c = CATALOGUE[ex.id];
    if (c.type === 'elastique') return resistances(p);
    if (c.type === 'mixte') return etapesElastique(c, p);
    const l = [];
    for (let k = -30; k <= 30; k++) {
      const kg = arrondi(ex.charge + k * c.pas);
      if (kg >= 1 && kg <= 60) l.push(kg);
    }
    return l;
  }
  // Répétitions qu'on peut attendre à `charge`, d'après `reps` faites à `kg` (formule d'Epley) : une estimation
  function repsEstimees(kg, reps, charge) { return 30 * (kg * (1 + reps / 30) / charge - 1); }
  // Charge visée d'après une séance : { kg } ; { rien: 'bout' } quand l'échelle s'arrête dans ce sens.
  // Plus lourd : la charge dont l'estimation tombe le plus près du milieu de la fourchette, sans passer sous le plancher ;
  // si même le cran suivant y passerait, c'est lui quand même ({ kg, saut: true }) : un gros cran, à prendre par le bas.
  function chargeVisee(ex, p, series, sens) {
    const f = fourchette(ex), cible = (f.min + f.max) / 2;
    const moy = series.reduce(function (s, n) { return s + n; }, 0) / series.length;
    const l = chargesPossibles(ex, p).filter(function (kg) { return sens > 0 ? kg > ex.charge : kg < ex.charge; });
    if (!l.length) return { rien: 'bout' };
    const estime = function (kg) { return repsEstimees(ex.charge, moy, kg); };
    const tenables = l.filter(function (kg) { return estime(kg) >= f.min; });
    if (!tenables.length) return sens > 0 ? { kg: l[0], saut: true } : { kg: l[0] };
    tenables.sort(function (a, b) { return Math.abs(estime(a) - cible) - Math.abs(estime(b) - cible) || a - b; });
    return { kg: tenables[0] };
  }
  // Libellé court d'une charge : « 30 kg (10 + 20) », « 10 kg », « sans élastique »
  function libelleCharge(ex, p) {
    const c = CATALOGUE[ex.id];
    if (c.type === 'mixte' && ex.niveau < c.variantes.length) return 'sans élastique';
    if (c.type === 'elastique' || c.type === 'mixte') return libelleElastique(ex.charge, p);
    return kgTexte(ex.charge) + ' kg';
  }

  // ---------- Calibrage : une fourchette tirée de ce que le joueur fait vraiment, une fois par échelon.
  // Une charge ou un élastique plus lourd ne recalibre pas : c'est la progression normale.
  function cleCalibrage(ex) {
    const c = CATALOGUE[ex.id];
    return c.type === 'variante' || c.type === 'mixte' ? 'n' + ex.niveau : 'charge';
  }
  function estCalibre(ex) { return ex.calibre === cleCalibrage(ex); }
  // La fourchette où la séance tombe vers le milieu ; si possible sans série sous le plancher ni au-dessus du plafond
  function proposerFourchette(series, candidates) {
    const l = (series || []).filter(function (n) { return typeof n === 'number' && n >= 0; });
    if (!l.length || !candidates.length) return null;
    const bas = Math.min.apply(null, l), haut = Math.max.apply(null, l);
    const moy = l.reduce(function (s, n) { return s + n; }, 0) / l.length;
    const ecart = function (f) { return Math.abs((f[0] + f[1]) / 2 - moy); };
    let cands = candidates.filter(function (f) { return f[0] <= bas && f[1] >= haut; });
    if (!cands.length) cands = candidates;
    return cands.slice().sort(function (x, y) { return ecart(x) - ecart(y) || x[0] - y[0]; })[0].slice();
  }
  // Ce que le coach propose après une séance à un réglage pas encore calibré :
  // - exercice à charge hors de sa fourchette : la charge visée ({ sens, vers, texte, charge: true }),
  //   avec la fourchette où la séance tombe en alternative ;
  // - exercice au poids du corps : un autre échelon si c'est nettement trop dur ou trop facile ;
  // - sinon une fourchette ({ reps }) ; { calibre: true } quand il n'y a rien à proposer.
  function evaluerCalibrage(p, ex, series) {
    const candidates = fourchettesProposees(ex);
    const haut = Math.max.apply(null, series), bas = Math.min.apply(null, series);
    if (aCharge(ex)) {
      const f = fourchette(ex);
      const sens = bas > f.max ? 1 : haut < f.min ? -1 : 0;
      if (!sens) return { calibre: true };
      const v = chargeVisee(ex, p, series, sens);
      if (v.kg != null) {
        const vers = Object.assign({}, ex, { charge: v.kg });
        const r = { sens: sens, vers: vers, texte: reglage(vers, p), charge: true };
        if (v.saut) r.saut = true;
        const alt = proposerFourchette(series, candidates);
        if (alt && !(alt[0] === f.min && alt[1] === f.max)) r.alternative = alt;
        return r;
      }
      if (sens < 0 && CATALOGUE[ex.id].type === 'mixte') {
        const vers = changerReglage(ex, -1, p);
        if (vers) return { sens: -1, vers: vers, texte: reglage(vers, p) };
      }
      // Bout de l'échelle : faute de charge, c'est la fourchette qui s'adapte
    } else {
      const sens = haut < candidates[0][0] ? -1 : bas > candidates[candidates.length - 1][1] ? 1 : 0;
      const vers = sens ? changerReglage(ex, sens, p) : null;
      if (vers) return { sens: sens, vers: vers, texte: reglage(vers, p) };
    }
    const f = proposerFourchette(series, candidates), actuelle = fourchette(ex);
    if (f[0] === actuelle.min && f[1] === actuelle.max) return { calibre: true };
    return { reps: f };
  }
  // Après une expédition, pour chaque exercice pas encore calibré à son échelon. Une séance où la charge a changé
  // en cours de route compte au réglage final : les séries d'avant sont rangées sous l'ancien réglage.
  function calibrer(p, seance) {
    const nouvelles = [];
    (seance.exercices || []).forEach(function (fait) {
      const ex = p.programme.filter(function (e) { return e.id === fait.id; })[0];
      if (!ex || !ex.actif || !CATALOGUE[ex.id] || estCalibre(ex) || !fait.series || !fait.series.length) return;
      if (fait.reglage !== reglage(ex, p)) return;   // réglage changé depuis la séance
      const prop = { id: ex.id, cle: cleCalibrage(ex), reglage: reglage(ex, p), seance: seance.id, series: fait.series.slice() };
      const e = evaluerCalibrage(p, ex, fait.series);
      if (e.calibre) { ex.calibre = prop.cle; return; }
      nouvelles.push(Object.assign(prop, e));
    });
    if (nouvelles.length) {
      const ids = nouvelles.map(function (x) { return x.id; });
      p.calibrages = (p.calibrages || []).filter(function (x) { return ids.indexOf(x.id) < 0; }).concat(nouvelles);
    }
    return nouvelles;
  }
  // Propositions encore valables : l'exercice est actif et son réglage n'a pas bougé depuis la séance
  function calibragesEnAttente(p) {
    return (p.calibrages || []).filter(function (x) {
      const ex = p.programme.filter(function (e) { return e.id === x.id; })[0];
      return ex && ex.actif && CATALOGUE[ex.id] && !estCalibre(ex) && x.cle === cleCalibrage(ex) && x.reglage === reglage(ex, p);
    });
  }
  // Réponse du joueur : accepter applique la proposition, refuser garde le réglage. L'échelon est alors calibré,
  // sauf si le joueur accepte un autre échelon : celui-ci le sera à sa première séance.
  // accepte = 'alt' : garder la charge et prendre la fourchette proposée en alternative.
  function repondreCalibrage(p, id, accepte) {
    const x = calibragesEnAttente(p).filter(function (c) { return c.id === id; })[0];
    p.calibrages = (p.calibrages || []).filter(function (c) { return c.id !== id; });
    if (!x) return null;
    const i = p.programme.map(function (e) { return e.id; }).indexOf(id);
    const ex = p.programme[i];
    if (accepte === 'alt') {
      if (x.alternative) {
        const coach = fourchetteCoach(ex);
        if (x.alternative[0] === coach.min && x.alternative[1] === coach.max) delete ex.reps; else ex.reps = x.alternative.slice();
      }
      ex.calibre = x.cle;
      return x;
    }
    if (accepte && x.vers) {
      const n = Object.assign({}, ex, { niveau: x.vers.niveau, charge: x.vers.charge });
      if (n.niveau === undefined) delete n.niveau;
      if (n.charge === undefined) delete n.charge;
      // Nouvelle charge : la double progression prend le relais (pas de nouveau calibrage qui ferait l'aller-retour)
      if (x.charge && aCharge(n)) n.calibre = cleCalibrage(n);
      p.programme[i] = n;
      return x;
    }
    if (accepte && x.reps) {
      const coach = fourchetteCoach(ex);
      if (x.reps[0] === coach.min && x.reps[1] === coach.max) delete ex.reps; else ex.reps = x.reps.slice();
    }
    ex.calibre = x.cle;
    return x;
  }

  // ---------- Séance du jour : priorités en tête, séries ajustées à la durée visée
  const ECHAUFFEMENT = 5;        // minutes
  const MINUTES_PAR_SERIE = 2;   // une série et son repos
  function planSeance(p) {
    const prio = p.priorites || [];
    const exos = p.programme.filter(function (e) { return e.actif && CATALOGUE[e.id]; }).map(function (e) {
      const groupes = CATALOGUE[e.id].groupes.filter(function (g) { return prio.indexOf(g) >= 0; });
      return { ex: e, priorite: groupes.length > 0, groupes: groupes, series: groupes.length ? 4 : 3 };
    });
    // Les abdos ferment toujours la séance : ils stabilisent tout le reste
    exos.sort(function (a, b) {
      const ga = CATALOGUE[a.ex.id].stat === 'Gainage' ? 1 : 0, gb = CATALOGUE[b.ex.id].stat === 'Gainage' ? 1 : 0;
      if (ga !== gb) return ga - gb;
      if (a.priorite !== b.priorite) return a.priorite ? -1 : 1;
      return ORDRE.indexOf(a.ex.id) - ORDRE.indexOf(b.ex.id);
    });
    function duree() { return ECHAUFFEMENT + MINUTES_PAR_SERIE * exos.reduce(function (t, x) { return t + x.series; }, 0); }
    // Pour tenir dans la durée visée : le reste descend d'abord à 2 séries, puis les priorités à 3, en partant de la fin
    for (let i = exos.length - 1; i >= 0 && duree() > p.plan.minutes; i--) {
      if (!exos[i].priorite) exos[i].series = 2;
    }
    for (let i = exos.length - 1; i >= 0 && duree() > p.plan.minutes; i--) {
      if (exos[i].priorite) exos[i].series = 3;
    }
    return { exos: exos, minutes: duree(), depasse: duree() > p.plan.minutes };
  }
  // Fixe les priorités et active l'exercice complémentaire de chacune ; renvoie les exercices ajoutés
  function definirPriorites(p, liste) {
    const ajoutes = [];
    p.priorites = liste.slice(0, 2);
    p.priorites.forEach(function (g) {
      (COMPLEMENTS[g] || []).forEach(function (id) {
        let e = p.programme.filter(function (x) { return x.id === id; })[0];
        if (!e) { e = defautExercice(id); p.programme.push(e); }
        if (!e.actif) { e.actif = true; ajoutes.push(id); }
      });
    });
    return ajoutes;
  }

  // ---------- Mise à jour des parties enregistrées avec une version précédente
  function migrer(p) {
    if (!p || !Array.isArray(p.programme)) return p;
    const version = p.v || 1; // version d'origine de la partie : les annonces ne parlent que de ce que le joueur a connu
    if (version < 2) {
      // v2 : les relevés à la barre quittent l'échelle de la roulette pour devenir un exercice à part
      let releves = false;
      p.programme.forEach(function (e) {
        if (e.id !== 'abdos') return;
        const n = Math.max(0, Math.min(5, e.niveau | 0));
        if (n === 3) releves = true;
        e.niveau = [0, 1, 2, 2, 3, 4][n];
      });
      if (!p.programme.some(function (e) { return e.id === 'chinup'; })) p.programme.push(defautExercice('chinup'));
      if (!p.programme.some(function (e) { return e.id === 'releves'; })) {
        const r = defautExercice('releves');
        r.actif = releves;
        p.programme.push(r);
      }
      if (!Array.isArray(p.priorites)) p.priorites = null; // null : pas encore choisies
      p.v = 2;
    }
    if (p.v < 3) {
      // v3 : la priorité « Biceps » devient « Bras » (biceps et triceps), avec l'extension triceps
      if (!p.programme.some(function (e) { return e.id === 'triceps'; })) p.programme.push(defautExercice('triceps'));
      if (Array.isArray(p.priorites)) {
        p.priorites = p.priorites.map(function (g) { return g === 'biceps' ? 'bras' : g; });
        if (p.priorites.indexOf('bras') >= 0 && definirPriorites(p, p.priorites).indexOf('triceps') >= 0) {
          p.annonces = (p.annonces || []).concat(['triceps']);
        }
      }
      p.v = 3;
    }
    if (p.v < 4) {
      // v4 : jambes et fessiers dans la séance de base, et dossier de l'infirmerie
      let ajoute = false;
      ['squat', 'hipthrust'].forEach(function (id) {
        let e = p.programme.filter(function (x) { return x.id === id; })[0];
        if (!e) { e = defautExercice(id); p.programme.push(e); }
        if (!e.actif) { e.actif = true; ajoute = true; }
      });
      if (ajoute) p.annonces = (p.annonces || []).concat(['jambes']);
      if (!Array.isArray(p.mesures)) p.mesures = [];
      p.v = 4;
    }
    if (p.v < 5) {
      // v5 : registre de pesée
      if (!Array.isArray(p.pesees)) p.pesees = [];
      if (!p.rappelPesee) p.rappelPesee = 'matin';
      p.v = 5;

      const brut = await Regard.sample.json(consigne.texte, { images: images, cache: false });
      const r = V.lireRegard(S.profil, brut);
      if (!r) throw { code: 'invalid_json' };
      r.date = date; r.cree = new Date().toISOString();
      S.profil.rapports = (S.profil.rapports || []).filter(function (x) { return x.date !== date; }).concat([r]);
      persister();
      avis('Rapport d’Ida rangé dans ta fiche.');
    } catch (e) {
      const code = e && e.code;
      if (code === 'not_granted') { Regard.etat = 'refuse'; avis('Sans ton accord pour envoyer les photos à Claude, Ida ne peut pas faire son rapport.', true); }
      else if (['sampling_disabled', 'images_unavailable', 'not_declared', 'capability_disabled', 'capability_removed'].indexOf(code) >= 0) { Regard.etat = 'non'; avis('Le rapport d’Ida n’est pas disponible ici.', true); }
      else if (code === 'rate_limited') avis('Ida est débordée : réessaie un peu plus tard.', true);
      else if (code === 'refused') avis('Ida n’a pas pu examiner ces photos. Essaie avec d’autres.', true);
      else if (code === 'photo_absente') avis('Une photo manque : reprends-la à ta prochaine visite.', true);
      else if (code === 'image_rejected') avis('Une photo a été refusée : reprends-la.', true);
      else if (code !== 'cancelled') avis('Le rapport n’a pas pu être fait. Réessaie plus tard.', true);
    } finally { S.regardEnCours = false; render(); }
  }
  // Enregistre les photos de la visite du jour, puis met l'index du profil à jour
  async function enregistrerPhotos(date, nouvelles, retirees) {
    let echec = null;
    for (let i = 0; i < retirees.length; i++) {
      const ph = V.photoDe(S.profil, date, retirees[i]);
      if (!ph) continue;
      try { await Photos.supprimer(ph.id); } catch (e) { echec = e; continue; }
      S.profil.photos = (S.profil.photos || []).filter(function (x) { return x.id !== ph.id; });
    }
    for (let i = 0; i < nouvelles.length; i++) {
      const id = date + '-' + nouvelles[i].angle;
      try { await Photos.enregistrer(id, nouvelles[i].donnees); } catch (e) { echec = e; delete Photos.cache[id]; continue; }
      S.profil.photos = (S.profil.photos || []).filter(function (x) { return x.id !== id; }).concat([{ id: id, date: date, angle: nouvelles[i].angle }]);
    }
    persister(); render();
    if (echec) avis(echec.code === 'quota_exceeded' ? 'Plus de place pour tes photos. Retire d’anciennes photos pour en ajouter.' : 'Des photos n’ont pas pu être enregistrées. Réessaie.', true);
    else if (nouvelles.length) avis(nouvelles.length > 1 ? 'Photos rangées dans ta fiche signalétique.' : 'Photo rangée dans ta fiche signalétique.');
  }

  async function synchroniser() {
    const d = await Store.charger();
    let profil = d.profil;
    const localPlusRecent = S.profil && (!profil || (S.profil.maj || '') > (profil.maj || ''));
    if (localPlusRecent) profil = S.profil;
    const parId = {};
    d.seances.forEach(function (s) { parId[s.id] = s; });
    const aEnvoyer = [];
    S.seances.forEach(function (s) { if (!parId[s.id]) { parId[s.id] = s; aEnvoyer.push(s); } });
    S.profil = migrerProfil(profil);
    S.seances = Object.keys(parId).map(function (k) { return parId[k]; });
    if (S.profil) stockageLocal(CLE_LOCAL, { profil: S.profil, seances: S.seances });
    for (let i = 0; i < aEnvoyer.length; i++) await Store.sauverSeance(aEnvoyer[i]);
    if (localPlusRecent) await Store.sauverProfil(S.profil);
  }

  // ---------- État du jeu
  let migre = false;
  function migrerProfil(p) {
    if (p && (p.v || 1) < 11) migre = true;
    return V.migrer(p);
  }
  function recalculer() {
    if (!S.profil) return;
    S.jour = auj();
    S.sim = V.simuler(S.profil, S.seances, S.jour);
    if (S.sim.nouvellesMorts.length) {
      S.sim.nouvellesMorts.forEach(function (d) {
        const avant = V.simuler(S.profil, S.seances, V.addDays(d, -1));
        const sv = V.survivantA(S.profil, d);
        S.profil.morts.push({ date: d, nom: sv.nom, niveau: avant.niveau, jours: V.daysBetween(sv.depuis, d) });
      });
      S.form = { nom: '', mode: 'ironman' };
      persister();
      S.sim = V.simuler(S.profil, S.seances, S.jour);
    }
  }

  async function demarrer() {
    const cache = stockageLocal(CLE_LOCAL);
    S.brouillon = stockageLocal(CLE_BROUILLON);
    if (cache && cache.profil) {
      S.profil = migrerProfil(cache.profil);
      S.seances = cache.seances || [];
      recalculer();
      S.ecran = S.brouillon ? 'expedition' : 'accueil';
    }
    render();
    await Promise.all([Store.init(), initRegard()]);
    if (Store.db) {
      try { await synchroniser(); S.stockage = 'compte'; }
      catch (e) { S.stockage = 'local'; avis('Ta sauvegarde en ligne ne répond pas. Le jeu continue sur ce téléphone.', true); }
    }
    if (!S.profil) { S.ecran = 'inscription'; S.form = formulaireInscription(); }
    else {
      if (migre) { migre = false; persister(); }
      recalculer();
      if (S.ecran === 'chargement') S.ecran = S.brouillon ? 'expedition' : 'accueil';
    }
    Photos.pret = true;
    render();
  }

  // ---------- Rendu
  let dernierEcran = null;
  function render() {
    const garder = dernierEcran === S.ecran;
    const y = window.scrollY;
    let html;
    if (S.ecran === 'chargement') html = ecranChargement();
    else if (S.ecran === 'inscription') html = ecranInscription();
    else if (besoinNouveauSurvivant()) html = ecranMort();
    else if (S.ecran === 'expedition') html = ecranExpedition();
    else if (S.ecran === 'effort') html = ecranEffort();
    else if (S.ecran === 'bilan') html = ecranBilan();
    else if (S.ecran === 'libre') html = ecranLibre();
    else if (S.ecran === 'visite') html = ecranVisite();
    else if (S.ecran === 'tuto') html = ecranTuto();
    else if (S.ecran === 'survivant') html = ecranSurvivant();
    else if (S.ecran === 'carnet') html = ecranCarnet();
    else { S.ecran = 'accueil'; html = ecranAccueil(); }
    if (S.majDispo) html = '<button type="button" class="bandeau-maj" data-action="recharger"><strong>Nouvelle version de Valgrise.</strong> Touche ici pour l’ouvrir.</button>' + html;
    app.innerHTML = html;
    const avecOnglets = S.profil && !besoinNouveauSurvivant() && ['accueil', 'survivant', 'carnet'].indexOf(S.ecran) >= 0;
    app.classList.toggle('sans-onglets', !avecOnglets);
    ongletsEl.innerHTML = avecOnglets ? onglets() : '';
    window.scrollTo(0, garder ? y : 0);
    if (S.ancre) {
      const cible = document.getElementById(S.ancre);
      S.ancre = null;
      if (cible && cible.scrollIntoView) cible.scrollIntoView({ block: 'start' });
    }
    dernierEcran = S.ecran;
    tic();
  }

  // Réglage codé dans une liste : « n2 » pour un échelon, « k15 » pour une résistance d'élastique
  function optionsReglage(id, p) {
    const c = V.CATALOGUE[id], l = [];
    if (c.type === 'variante' || c.type === 'mixte') c.variantes.forEach(function (v, i) { l.push({ valeur: 'n' + i, texte: v }); });
    if (c.type === 'mixte') V.etapesElastique(c, p).forEach(function (kg) { l.push({ valeur: 'k' + kg, texte: c.elastique + V.libelleElastique(kg, p) }); });
    if (c.type === 'elastique') V.resistances(p).forEach(function (kg) { l.push({ valeur: 'k' + kg, texte: 'Élastique de ' + V.libelleElastique(kg, p) }); });
    return l;
  }
  function valeurReglage(ex) {
    const c = V.CATALOGUE[ex.id];
    return c.type === 'variante' || (c.type === 'mixte' && ex.niveau < c.variantes.length) ? 'n' + ex.niveau : 'k' + ex.charge;
  }
  function lireReglage(id, valeur) {
    const c = V.CATALOGUE[id], v = String(valeur);
    if (v.charAt(0) === 'n') return { niveau: +v.slice(1) };
    return c.type === 'mixte' ? { niveau: c.variantes.length, charge: +v.slice(1) } : { charge: +v.slice(1) };
  }

  function inscrire() {
    const f = S.form;
    const minutes = Math.round(+f.minutes), nom = String(f.nom || '').trim();
    f.erreurNom = !nom;
    if (!nom) f.erreur = 'Ton survivant a besoin d’un nom : écris-le en haut, sur la carte.';
    else if (f.jours.length < 2) f.erreur = 'Choisis au moins deux jours d’expédition.';
    else if (!(minutes >= 15 && minutes <= 120)) f.erreur = 'La durée doit être comprise entre 15 et 120 minutes.';
    else if (!(+f.curl > 0) || (f.hipthrust && !(+f.hipthrustCharge > 0))) f.erreur = 'Indique une charge en kilos pour chaque exercice aux haltères.';
    else f.erreur = '';
    if (f.erreur) {
      render();
      const champ = f.erreurNom ? document.getElementById('f-nom') : null;
      if (champ) champ.focus();
      return;
    }
    const programme = [
      { id: 'pompes', actif: true, series: 3, niveau: +f.pompes },
      { id: 'developpe', actif: true, series: 3, charge: +f.developpe },
      { id: 'curl', actif: true, series: 3, charge: +f.curl },
      { id: 'triceps', actif: !!f.triceps, series: 3, charge: +f.tricepsCharge },
      { id: 'chinup', actif: !!f.chinup, series: 3, niveau: +f.chinupNiveau },
      { id: 'abdos', actif: true, series: 3, niveau: +f.abdos },
      { id: 'releves', actif: !!f.releves, series: 3, niveau: +f.relevesNiveau },
      { id: 'rowing', actif: false, series: 3, charge: 15 },
      Object.assign({ id: 'squat', actif: true, series: 3 }, lireReglage('squat', f.squat)),
      { id: 'hipthrust', actif: !!f.hipthrust, series: 3, charge: +f.hipthrustCharge },
      { id: 'elevations', actif: !!f.elevations, series: 3, charge: +f.elevationsCharge }
    ];
    S.profil = V.nouveauProfil({
      date: auj(), horodatage: new Date().toISOString(), jours: f.jours.slice().sort(), minutes: minutes,
      nom: nom, mode: f.mode, programme: programme, priorites: f.priorites.slice()
    });
    S.seances = [];
    S.form = {};
    recalculer();
    persister();
    S.ecran = 'accueil';
    render();
    avis('Demande acceptée. ' + survivant().nom + ' arrive à la Sucrerie avec 7 rations.');
  }

  // ---------- Accueil : carte d'alimentation et ordre de sortie
  // Le nom du titulaire se corrige au crayon, sur la carte même
  function titulaire(sv) {
    if (!S.renommer) {
      return '<dt>Titulaire</dt><dd class="titulaire"><span>' + esc(sv.nom) + '</span>' +
        '<button type="button" class="lien petit-lien" data-action="renommer">Renommer</button></dd>';
    }
    const valeur = S.form.nouveauNom != null ? S.form.nouveauNom : sv.nom;
    return '<dt class="en-haut"><label for="f-renommer">Titulaire</label></dt><dd class="edition">' +
      '<input class="saisie" id="f-renommer" data-champ="nouveauNom" maxlength="24" autocomplete="off" enterkeyhint="done" value="' + esc(valeur) + '">' +
      '<div class="actions"><button type="button" class="lien petit-lien" data-action="renommer-ok">Valider</button>' +
      '<button type="button" class="lien petit-lien" data-action="renommer-annuler">Annuler</button></div></dd>';
  }
  function validerNom() {
    const nom = String(S.form.nouveauNom == null ? '' : S.form.nouveauNom).trim();
    if (!nom) {
      avis('Ton survivant a besoin d’un nom.', true);
      const champ = document.getElementById('f-renommer');
      if (champ) champ.focus();
      return;
    }
    const sv = survivant(), ancien = sv.nom;
    S.renommer = false; delete S.form.nouveauNom;
    if (nom === ancien) { render(); return; }
    sv.nom = nom;
    persister(); render();
    avis(ancien + ' s’appelle désormais ' + nom + '.');
  }
  function ecranAccueil() {
    const sim = S.sim, sv = survivant();
    const pleines = Math.floor(sim.xpDansNiveau / sim.xpBesoin * 10);
    let cases = '';
    for (let i = 0; i < 10; i++) cases += '<span class="case' + (i < pleines ? ' pleine' : '') + '"></span>';
    let tamp = '';
    if (sim.statut === 'abri') tamp = tampon('À L’ABRI', BLEU, { l: 140 });
    else if (sim.statut === 'convoi') tamp = tampon('EN CONVOI', BLEU, { l: 150 });
    else if (sim.statut === 'agonie') tamp = tampon('AGONIE', ROUGE, { l: 130 });
    else if (sim.statut === 'faim') tamp = tampon('FAIM', ROUGE, { l: 110 });
    else if (sim.stock <= 2) tamp = tampon('VIVRES BAS', ROUGE);
    const n = sim.joursAvantChute;
    let statut = 'Tickets restants sur la carte';
    if (sim.statut === 'faim') statut = 'Plus de vivres. Sans expédition, il tombe dans ' + pluriel(n, 'jour', 'jours') + '.';
    else if (sim.statut === 'agonie') statut = 'Il agonise. Sans expédition, il tombe dans ' + pluriel(n, 'jour', 'jours') + '.';
    else if (sim.statut === 'abri') statut = 'À l’abri depuis le ' + dateCourte(sim.pause.debut) + ' : il ne touche pas à ses vivres.';
    else if (sim.statut === 'convoi') statut = 'En convoi jusqu’au ' + dateCourte(sim.pause.fin) + ', sans toucher à ses vivres.';
    let tickets = '';
    for (let i = 1; i <= V.STOCK_MAX; i++) {
      if (i <= V.STOCK_MAX - sim.stock) tickets += '<span class="ticket decoupe"></span>';
      else tickets += '<span class="ticket kraft-clair"><span class="pochoir">n° ' + i + '</span><span class="mini">1 ration</span></span>';
    }
    const carte = '<section class="objet kraft carte" aria-label="Carte d’alimentation">' + enteteCarte(numeroCarte()) +
      '<h1 class="titre-imprime">Carte d’alimentation</h1><div class="filet"></div>' +
      '<dl class="champs">' + titulaire(sv) + '<dt>Catégorie</dt><dd>À évaluer</dd><dt>Niveau</dt><dd>' + sim.niveau + '</dd></dl>' +
      '<p class="mention mt-12">Expérience</p>' +
      '<div class="xp"><div class="cases" aria-hidden="true">' + cases + '</div><p class="manuscrit">' + sim.xpDansNiveau + ' sur ' + sim.xpBesoin + '</p></div>' +
      '<div class="vivres"><p class="pochoir chiffre">' + sim.stock + '</p><div><p class="sous-titre">' + (sim.stock > 1 ? 'jours de vivres' : 'jour de vivres') + '</p>' +
      '<p class="mention">' + esc(statut) + '</p></div>' + tamp + '</div>' +
      '<div class="tickets" aria-hidden="true">' + tickets + '</div>' +
      '<p class="petit mt-8">Carte strictement personnelle. Ticket perdu, ration perdue.</p></section>';
    return '<main class="pile">' + carte + peseeDuMatin() + noteCoach() + convocation() + ordreDeSortie() + '</main>';
  }

  // ---------- Visite au dispensaire
  const GRAPHITE = '#4A4945';
  function fondMillimetre(L, H) {

  function nombreFr(v, signe) {

  function cadrePhotoVisite(a) {

    else if (existante && !(f.retirees && f.retirees[a.cle])) {

      '<p class="legende-photo">' + esc(a.nom.toUpperCase()) + '</p>' +

  function blocPhotosVisite() {
    return '<p class="sous-titre mt-16" style="font-size: 19px; line-height: 22px">Fiche signalétique</p>' +
      '<p class="aide">Facultatif. Même endroit, même lumière, le matin : téléphone posé à hauteur de poitrine, à deux mètres, retardateur, bras relâchés. Tes photos ne sont visibles que par toi.</p>' +
      '<div class="fiche-photos">' + V.ANGLES.map(cadrePhotoVisite).join('') + '</div>';

  function ecranVisite() {
    const p = S.profil, f = S.form;

    const champs = V.MESURES.map(function (def) {

      return '<div class="bloc mt-12"><label class="mention" for="' + hid + '">' + esc(def.nom) + ', en cm</label>' +

        '<div class="bloc mt-12"><label class="mention" for="f-poids-visite">Poids, en kg</label>' +

      '<div class="actions mt-4"><button type="button" class="lien" data-action="aller" data-ecran="accueil">Annuler</button></div>' +
      '</section></main>';

  function courbeMesures(p) {
    const dates = V.mesuresTriees(p).map(function (m) { return m.date; });
    const L = 360, H = 200, g = 34, d = 106, h = 16, b = 28;
    const fond = fondMillimetre(L, H);
    if (dates.length < 2) {
      return '<svg class="courbe" viewBox="0 0 ' + L + ' ' + H + '" role="img" aria-label="Courbe des mensurations, vide pour l’instant">' + fond +
        '<text x="' + L / 2 + '" y="' + (H / 2 + 6) + '" text-anchor="middle" font-family="Caveat, cursive" font-size="22" fill="' + GRAPHITE + '">' +
        (dates.length ? 'La courbe démarre à la deuxième visite.' : 'Première visite à passer.') + '</text></svg>';
    }
    const series = V.ecartsMesures(p).filter(function (s) { return s.points.length; });
    const t = function (s) { return V.daysBetween(dates[0], s); };
    const tMax = Math.max(1, t(dates[dates.length - 1]));
    let ext = 1;
    series.forEach(function (s) { s.points.forEach(function (pt) { ext = Math.max(ext, Math.abs(pt.ecart)); }); });
    ext = Math.ceil(ext);
    const X = function (s) { return g + t(s) / tMax * (L - g - d); };
    const Y = function (v) { return h + (1 - (v + ext) / (2 * ext)) * (H - h - b); };
    const couleurs = { bras: BLEU, taille: ROUGE, hanches: GRAPHITE };
    const police = 'font-family="Archivo, Arial, sans-serif"';
    let tr = '<line x1="' + g + '" x2="' + (L - d) + '" y1="' + Y(0) + '" y2="' + Y(0) + '" stroke="' + GRAPHITE + '" stroke-width="1"></line>';
    [ext, 0, -ext].forEach(function (v) {
      tr += '<text x="' + (g - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" ' + police + ' fill="' + GRAPHITE + '">' + nombreFr(v, true) + '</text>';
    });
    tr += '<text x="' + g + '" y="' + (H - 9) + '" font-size="11" ' + police + ' fill="' + GRAPHITE + '">' + esc(dateCourte(dates[0])) + '</text>' +
      '<text x="' + (L - d) + '" y="' + (H - 9) + '" text-anchor="end" font-size="11" ' + police + ' fill="' + GRAPHITE + '">' + esc(dateCourte(dates[dates.length - 1])) + '</text>';
    const etiquettes = [];
    series.forEach(function (s) {
      const c = couleurs[s.cle];
      tr += '<polyline points="' + s.points.map(function (pt) { return X(pt.date).toFixed(1) + ',' + Y(pt.ecart).toFixed(1); }).join(' ') +
        '" fill="none" stroke="' + c + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>';
      s.points.forEach(function (pt) {
        tr += '<circle cx="' + X(pt.date).toFixed(1) + '" cy="' + Y(pt.ecart).toFixed(1) + '" r="2.6" fill="' + c + '"><title>' +
          esc(s.nom + ', ' + dateCourte(pt.date) + ' : ' + nombreFr(pt.valeur) + ' cm') + '</title></circle>';
      });
      const der = s.points[s.points.length - 1];
      etiquettes.push({ y: Y(der.ecart), texte: s.nom + ' ' + nombreFr(der.ecart, true), c: c });
    });
    // Étiquettes au bout des courbes, écartées pour ne pas se chevaucher
    etiquettes.sort(function (a, b2) { return a.y - b2.y; });
    for (let i = 1; i < etiquettes.length; i++) if (etiquettes[i].y - etiquettes[i - 1].y < 15) etiquettes[i].y = etiquettes[i - 1].y + 15;
    const deborde = etiquettes.length ? etiquettes[etiquettes.length - 1].y - (H - b) : 0;
    etiquettes.forEach(function (e) {
      tr += '<text x="' + (L - d + 10) + '" y="' + (e.y - Math.max(0, deborde) + 4) + '" font-size="12" font-weight="700" ' + police + ' fill="' + e.c + '">' + esc(e.texte) + '</text>';
    });
    const resume = etiquettes.map(function (e) { return e.texte + ' cm'; }).join(', ');
    return '<svg class="courbe" viewBox="0 0 ' + L + ' ' + H + '" role="img" aria-label="Écart depuis la première visite : ' + esc(resume) + '">' + fond + tr + '</svg>';
  }
  function sectionDossier() {
    const p = S.profil;
    const triees = V.mesuresTriees(p);
    const prochaine = V.prochaineVisite(p, S.jour);
    const lignes = triees.slice().reverse().map(function (m) {

      '<p class="manuscrit graphite mt-8">' + (prochaine <= S.jour ? 'Visite à passer.' : 'Prochaine visite : ' + esc(dateLongue(prochaine)) + '.') + '</p>' +

  // ---------- Bilan d'Ida : la toise
  function chiffre(v, d) { return v.toFixed(d).replace('.', ','); }
  function champsAdmission(p, f) {
    const sexe = f.sexe || '';
    return '<div class="bloc mt-12"><label class="mention" for="f-hauteur">Ta taille, en cm</label>' +

      '<div class="bloc mt-12"><label class="mention" for="f-naissance">Ton année de naissance</label>' +
